<!DOCTYPE html>
<html lang="en" class="dark" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SURAKSHA · National Disaster Intelligence & Multi-Hazard Decision Support</title>
<meta name="description" content="Satellite thermal anomaly surveillance and cyclone landfall impact prioritization decision-support platform. Built for SIH-26162.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<!-- React 18 & ReactDOM 18 CDN -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<!-- Babel Standalone for in-browser JSX parsing (Zero build step) -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>

/* ============ FIRESENSE DESIGN LANGUAGE ============ */
:root{
  --bg:#0a0c10;           /* graphite */
  --bg-2:#0e1117;
  --panel:#12151d;
  --line:rgba(255,255,255,.08);
  --white:#f5f6f7;        /* off-white type */
  --gray:#8b929e;         /* secondary */
  --gray-2:#5a606c;
  --fire:#ff5a1f;         /* warm fire orange */
  --fire-soft:rgba(255,90,31,.14);
  --ice:#7ec8f2;          /* satellite ice blue */
  --ice-soft:rgba(126,200,242,.12);
  --ease:cubic-bezier(.22,.61,.36,1);
  --font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --nav-bg:rgba(10,12,16,.72);
  --hover-line:rgba(255,255,255,.28);
  --card-hover:var(--panel);
  color-scheme:dark !important;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;color-scheme:dark !important;background:var(--bg)}
body{background:var(--bg) !important;color:var(--white) !important;font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;color-scheme:dark !important}
::selection{background:var(--fire);color:#fff}
a{color:inherit;text-decoration:none}
.container{max-width:1200px;margin:0 auto;padding:0 32px}

/* type scale */
.kicker{font-family:var(--font);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gray);display:flex;align-items:center;gap:12px}
.kicker .idx{color:var(--fire)}
h1{font-family:var(--font);font-size:clamp(52px,9vw,110px);font-weight:750;letter-spacing:-.035em;line-height:.98}
h2{font-family:var(--font);font-size:clamp(34px,5vw,64px);font-weight:650;letter-spacing:-.03em;line-height:1.05}
.body-lg{font-size:clamp(17px,2vw,21px);color:var(--gray);line-height:1.6;font-weight:400}
.meta{font-family:var(--font);font-size:12px;letter-spacing:.04em;color:var(--gray-2)}

/* ============ THERMAL PULSE (signature) ============ */
.pulse{position:relative;width:12px;height:12px;border-radius:50%;background:var(--fire);flex:none}
.pulse::before,.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--fire);animation:tp 3s var(--ease) infinite}
.pulse::after{animation-delay:1.5s}
@keyframes tp{0%{transform:scale(1);opacity:.9}70%{transform:scale(4.2);opacity:0}100%{transform:scale(4.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse::before,.pulse::after{animation:none;opacity:0}}

/* ============ NAV ============ */
nav{position:fixed;top:0;left:0;right:0;z-index:100;transition:all .45s var(--ease)}
nav .inner{max-width:1200px;margin:0 auto;padding:26px 32px;display:flex;align-items:center;justify-content:space-between;transition:all .45s var(--ease)}
nav.scrolled{background:var(--nav-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
nav.scrolled .inner{padding:14px 32px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--fire);box-shadow:0 0 12px var(--fire)}
.nav-links{display:flex;gap:36px;font-size:14px;color:var(--gray)}
.nav-links a{transition:color .25s}
.nav-links a:hover{color:var(--white)}
.nav-cta{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--white);border:1px solid var(--line);padding:8px 18px;border-radius:99px;transition:all .3s var(--ease)}
.nav-cta:hover{border-color:var(--hover-line);background:rgba(127,127,127,.06)}
.status-chip{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--gray)}
.theme-toggle{width:36px;height:36px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--gray);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s var(--ease);font-size:15px;line-height:1}
.theme-toggle:hover{color:var(--white);border-color:var(--hover-line)}
@media(max-width:820px){.nav-links,.status-chip{display:none}}

/* ============ HERO ============ */
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;position:relative;padding:150px 0 110px}
.hero-eyebrow{margin-bottom:28px;animation:rise 1s var(--ease) both}
.hero h1{animation:rise 1s .1s var(--ease) both}
.hero h1 .dim{color:var(--gray-2)}
.hero-sub{margin-top:30px;max-width:480px;animation:rise 1s .22s var(--ease) both}
.hero-actions{margin-top:40px;display:flex;gap:16px;align-items:center;animation:rise 1s .32s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hero-eyebrow,.hero h1,.hero-sub,.hero-actions{animation:none;opacity:1}}

.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 30px;border-radius:99px;font-size:15px;font-weight:600;transition:all .35s var(--ease);cursor:pointer;border:none}
.btn-primary{background:var(--fire);color:#fff}
.btn-primary:hover{background:#ff6d38;transform:translateY(-1px);box-shadow:0 12px 40px -8px rgba(255,90,31,.45)}
.btn-ghost{color:var(--gray);border:1px solid var(--line)}
.btn-ghost:hover{color:var(--white);border-color:var(--hover-line)}
.arrow{transition:transform .3s var(--ease)}
.btn:hover .arrow,.link-arrow:hover .arrow{transform:translateX(4px)}

/* hero detection visual */
.hero-media{position:absolute;inset:0;overflow:hidden;background:var(--bg-2) url('/static/media/hero_india_night.jpg') center/cover no-repeat}
.hero-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s var(--ease)}
.hero-media video.ready{opacity:.85}
.hero-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,16,.82) 0%,rgba(10,12,16,.55) 42%,rgba(10,12,16,.35) 68%,var(--bg) 100%)}
.hero-content{position:relative;z-index:2}
@media (prefers-reduced-motion:reduce){.hero-media video{display:none}.hero-media::after{background:linear-gradient(180deg,rgba(10,12,16,.6) 0%,rgba(10,12,16,.35) 50%,var(--bg) 100%)}}
.hero-signal{position:absolute;inset:0;z-index:1;pointer-events:none}
.hv-crosshair{position:absolute;left:68%;top:44%;transform:translate(-50%,-50%)}
/* cinematic media layer: NASA Black Marble night imagery (public domain) */
.hv-media{display:none}
/* terrain contours: opacity-only depth */
.hv-terrain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.4;z-index:1}
.hv-terrain path{fill:none;stroke:var(--gray-2);stroke-width:1;opacity:.14}
.hv-terrain path.hot{stroke:var(--fire);opacity:.16}
/* satellite signal track */
.hv-orbit{display:none}
.hv-sat{position:absolute;width:7px;height:7px;border-radius:2px;background:var(--ice);transform:rotate(45deg);box-shadow:0 0 10px rgba(126,200,242,.6)}
.hv-track{position:absolute;width:1px;background:repeating-linear-gradient(180deg,var(--ice) 0 5px,transparent 5px 11px);opacity:.4;animation:hvtrack 7s cubic-bezier(.16,1,.3,1) infinite}
@keyframes hvtrack{0%{background-position-y:0}100%{background-position-y:44px}}
.hv-orbit .olabel{position:absolute;font-family:var(--font);font-size:9.5px;letter-spacing:.14em;color:var(--gray-2);white-space:nowrap}
.hv-glow{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,31,.22) 0%,rgba(255,90,31,.07) 45%,transparent 70%)}
.hv-ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,90,31,.35);animation:hvring 5s cubic-bezier(.16,1,.3,1) infinite}
.hv-ring.r2{animation-delay:2.5s}
@keyframes hvring{0%{transform:translate(-50%,-50%) scale(.22);opacity:.9}75%{transform:translate(-50%,-50%) scale(1);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.hv-dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--fire);box-shadow:0 0 24px var(--fire),0 0 60px rgba(255,90,31,.5);animation:hvblink 5s cubic-bezier(.16,1,.3,1) infinite}
@keyframes hvblink{0%,100%{opacity:1}50%{opacity:.6}}
@media(max-width:820px){.hv-glow{width:120px;height:120px}.hv-ring{width:150px;height:150px}.hv-orbit{display:none}}
@media(max-width:820px){
  .hero-media::after{background:linear-gradient(180deg,rgba(10,12,16,.88) 0%,rgba(10,12,16,.74) 45%,rgba(10,12,16,.58) 75%,var(--bg) 100%)}
  .hv-crosshair{left:76%;top:22%}
  .hv-tag{display:none}
  .hv-meta{gap:22px;bottom:26px;padding:0 22px}
  .hv-meta .v{font-size:12px}
}
/* editorial full-width media moment */
.editorial{position:relative;overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg-2)}
.editorial img{display:block;width:100%;height:min(62vh,540px);object-fit:cover;transform:scale(1.06);transition:transform 2.4s var(--ease);filter:saturate(.85)}
.editorial.in img{transform:scale(1)}
.editorial .ed-cap{position:absolute;left:28px;bottom:22px;font-family:var(--font);font-size:10px;font-weight:600;letter-spacing:.14em;color:rgba(245,246,247,.75);background:rgba(10,12,16,.65);backdrop-filter:blur(8px);padding:8px 14px;border-radius:8px}
@media (prefers-reduced-motion:reduce){.editorial img{transform:none;transition:none}}
@media(max-width:820px){.editorial img{height:38vh}}
.hv-tag{position:absolute;left:calc(68% + 30px);top:44%;transform:translateY(-50%);background:rgba(10,12,16,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,90,31,.35);border-radius:10px;padding:12px 18px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:tagin 1s 1.4s var(--ease) both}
@keyframes tagin{from{opacity:0;transform:translateY(-50%) translateX(-8px)}to{opacity:1;transform:translateY(-50%)}}
.hv-tag .t1{font-family:var(--font);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--fire)}
.hv-tag .t2{font-family:var(--font);font-size:15px;font-weight:700;letter-spacing:-.01em;margin-top:4px;color:#ffffff}
.hv-tag .t3{font-family:var(--font);font-size:11.5px;font-weight:500;letter-spacing:.02em;color:var(--gray);margin-top:4px;font-variant-numeric:tabular-nums}
.hv-meta{position:absolute;left:0;right:0;bottom:34px;display:flex;gap:44px;padding:0 32px;max-width:1200px;margin:0 auto}
.hv-meta div{animation:rise .9s 1.9s var(--ease) both}
.hv-meta .k{font-family:var(--font);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gray-2);margin-bottom:6px}
.hv-meta .v{font-family:var(--font);font-size:13.5px;font-weight:600;letter-spacing:.02em;color:var(--white);font-variant-numeric:tabular-nums}
.hv-scan{position:absolute;top:0;bottom:0;width:1px;z-index:1;background:linear-gradient(180deg,transparent,rgba(126,200,242,.30),transparent);left:20%;animation:scan 11s linear infinite}
@keyframes scan{0%{left:8%}50%{left:88%}100%{left:8%}}
@media (prefers-reduced-motion:reduce){.hv-ring,.hv-scan,.hv-track,.hv-dot{animation:none;opacity:.35}.hv-tag,.hv-meta div{animation:none;opacity:1}.hv-glow{opacity:.6}}

/* ============ SECTIONS ============ */
section{padding:150px 0}
.section-head{max-width:640px;margin-bottom:70px}
.section-head h2{margin-top:22px}
.section-head p{margin-top:22px}

/* reveal on scroll */
.reveal{opacity:0;transform:translateY(34px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}

/* DETECT: big stat row */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.stat{background:var(--bg-2);padding:44px 40px}
.stat .n{font-size:clamp(38px,4.5vw,56px);font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat .n .unit{font-size:.45em;color:var(--gray);font-weight:500;margin-left:6px}
.stat .l{margin-top:10px;font-size:14px;color:var(--gray);line-height:1.5}
.stat.ice .n{color:var(--ice)}
.stat.fire .n{color:var(--fire)}
@media(max-width:820px){.stat-row{grid-template-columns:1fr}}

/* CLASSIFY: transition board */
.classify-board{border:1px solid var(--line);border-radius:20px;background:var(--bg-2);padding:70px 40px;display:flex;flex-direction:column;align-items:center;gap:0}
.cb-stage{font-family:var(--mono);letter-spacing:.24em;font-size:clamp(18px,3vw,30px);font-weight:600;text-align:center}
.cb-stage.anomaly{color:var(--gray-2)}
.cb-stage.classifying{color:var(--ice)}
.cb-stage.result{color:var(--fire)}
.cb-arrow{color:var(--gray-2);font-size:20px;margin:22px 0;line-height:1;animation:cbdown 2.4s var(--ease) infinite}
@keyframes cbdown{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(6px);opacity:1}}
@media (prefers-reduced-motion:reduce){.cb-arrow{animation:none;opacity:.7}}
.cb-classes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:44px}
.cb-chip{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;padding:8px 16px;border:1px solid var(--line);border-radius:99px;color:var(--gray);transition:all .3s}
.cb-chip:hover{border-color:var(--fire);color:var(--fire)}
.cb-chip.active{border-color:var(--fire);color:var(--fire);background:var(--fire-soft)}

/* CONTEXT: map-ish panel */
.context-panel{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--bg-2)}
.context-map{position:relative;height:400px;background:
  radial-gradient(ellipse 50% 60% at 30% 60%, rgba(255,90,31,.06), transparent 60%),
  linear-gradient(var(--line) 1px, transparent 1px),
  linear-gradient(90deg, var(--line) 1px, transparent 1px),
  var(--bg-2);
  background-size:auto,64px 64px,64px 64px,auto}
.cm-node{position:absolute;transform:translate(-50%,-50%);text-align:center}
.cm-node .pin{width:10px;height:10px;border-radius:50%;margin:0 auto 8px}
.cm-node .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--gray)}
.cm-node.incident .pin{background:var(--fire);box-shadow:0 0 18px var(--fire)}
.cm-node.incident .lbl{color:var(--fire)}
.cm-node.facility .pin{background:var(--ice)}
.cm-node.settlement .pin{background:var(--gray)}
.cm-line{position:absolute;height:1px;background:linear-gradient(90deg,var(--ice),transparent);transform-origin:left center}
.context-legend{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
.cl-item{background:var(--bg-2);padding:26px 28px}
.cl-item .k{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--gray-2);margin-bottom:8px}
.cl-item .v{font-size:16px;font-weight:600}
.cl-item .v .lv{font-size:11px;font-family:var(--mono);margin-left:8px;padding:2px 8px;border-radius:99px}
.lv-high{background:var(--fire-soft);color:var(--fire)}
.lv-med{background:var(--ice-soft);color:var(--ice)}
@media(max-width:900px){.context-legend{grid-template-columns:1fr 1fr}}


/* evidence bars (CLASSIFY): weighted proof behind the model score */
.evidence{margin-top:44px;width:100%;max-width:640px;display:flex;flex-direction:column;gap:16px;text-align:left}
.ev .row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:7px}
.ev .row .n{color:var(--white);font-weight:600}
.ev .row .v{font-family:var(--mono);color:var(--gray)}
.ev .track{height:3px;background:var(--line);border-radius:99px;overflow:hidden}
.ev .fill{height:100%;width:0;background:var(--fire);border-radius:99px;transition:width 1.2s var(--ease)}
.ev.hot .fill{background:var(--fire)}
.ev.cool .fill{background:var(--ice)}
.ev-note{margin-top:18px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--gray-2);letter-spacing:.08em}
/* response state timeline */
.rs-timeline{display:flex;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.rs-state{flex:1;background:var(--bg-2);padding:16px 12px;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--gray-2);position:relative;transition:color .3s}
.rs-state::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent;transition:background .3s}
.rs-state.done{color:var(--gray)}
.rs-state.active{color:var(--fire)}
.rs-state.active::after{background:var(--fire)}
/* focus visibility (keyboard) */
a:focus-visible,button:focus-visible{outline:2px solid var(--fire);outline-offset:3px;border-radius:6px}
/* RISK: the number is the hero */
.risk-wrap{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.risk-number{font-size:clamp(150px,22vw,280px);font-weight:700;letter-spacing:-.05em;line-height:1;color:var(--fire);font-variant-numeric:tabular-nums}
.risk-label{font-family:var(--mono);letter-spacing:.3em;font-size:14px;color:var(--gray);margin-top:8px}
.risk-bars{display:flex;flex-direction:column;gap:26px}
.rb .row{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:10px}
.rb .row .pc{font-family:var(--mono);color:var(--gray)}
.rb .track{height:3px;background:var(--line);border-radius:99px;overflow:hidden}
.rb .fill{height:100%;background:var(--fire);border-radius:99px;width:0;transition:width 1.4s var(--ease)}
.risk-note{margin-top:30px;font-size:13px;color:var(--gray-2);font-style:italic}
@media(max-width:900px){.risk-wrap{grid-template-columns:1fr;gap:50px}}

/* RESPONSE: one incident, three views */
.response-stage{border:1px solid var(--line);border-radius:20px;background:var(--bg-2);overflow:hidden}
.rs-tabs{display:flex;border-bottom:1px solid var(--line)}
.rs-tab{flex:1;padding:22px;font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;color:var(--gray-2);text-align:center;cursor:pointer;transition:all .3s;border-bottom:2px solid transparent}
.rs-tab:hover{color:var(--gray)}
.rs-tab.active{color:var(--white);border-bottom-color:var(--fire);background:rgba(255,255,255,.02)}
.rs-body{padding:60px 40px;min-height:230px;display:flex;align-items:center;justify-content:space-between;gap:40px}
.rs-id{font-family:var(--mono);font-size:13px;color:var(--gray-2)}
.rs-main .t{font-size:clamp(26px,3.5vw,40px);font-weight:650;letter-spacing:-.02em}
.rs-main .d{margin-top:12px;color:var(--gray);font-size:15px;max-width:420px;line-height:1.6}
.rs-side{text-align:right}
.rs-side .big{font-size:56px;font-weight:650;color:var(--fire);font-variant-numeric:tabular-nums}
.rs-side .k{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--gray-2);margin-top:6px}
@media(max-width:820px){.rs-body{flex-direction:column;align-items:flex-start}.rs-side{text-align:left}}

/* PORTALS */
.portal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.portal{border:1px solid var(--line);border-radius:20px;padding:36px 28px;background:var(--bg-2);transition:all .45s var(--ease);display:flex;flex-direction:column;min-height:320px}
.portal:hover{border-color:var(--hover-line);transform:translateY(-4px);background:var(--card-hover)}
.portal .pk{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--gray-2)}
.portal h3{font-size:26px;font-weight:650;letter-spacing:-.02em;margin-top:40px}
.portal .pv{color:var(--fire);font-size:17px;font-weight:600;margin-top:6px}
.portal p{color:var(--gray);font-size:13.5px;line-height:1.6;margin-top:14px;flex:1}
.portal .link-arrow{margin-top:24px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.portal.intel:hover{border-color:rgba(126,200,242,.4)}
